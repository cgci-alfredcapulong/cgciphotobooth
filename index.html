<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Teachers Day Photobooth</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Teachers Day Photobooth</h1>
      <p class="subtitle">Smile, you look great today</p>
    </header>

    <div class="camera-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <div class="countdown" id="countdown"></div>
      <div class="flash" id="flash"></div>

      <button id="flipBtn" class="flip-btn" title="Switch camera" aria-label="Switch camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 5h-3l-1.5-2h-7L7 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/>
          <path d="M15 11a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
          <path d="M21 3l-3 3M21 3h-3M21 3v3"/>
        </svg>
      </button>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary">Start Camera</button>
      <button id="captureBtn" class="btn btn-capture" disabled>Take Photo</button>
    </div>

    <div class="results" id="results"></div>

    <div class="actions" id="actions" style="display:none;">
      <button id="printBtn" class="btn btn-print">Print</button>
      <button id="retakeBtn" class="btn btn-secondary">Retake</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
