<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Teachers Day Photobooth</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Teachers Day Photobooth</h1>
      <p class="subtitle">Smile, you look great today</p>
    </header>

    <div class="camera-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <div class="countdown" id="countdown"></div>
      <div class="flash" id="flash"></div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary">Start Camera</button>
      <button id="captureBtn" class="btn btn-capture" disabled>Take Photo</button>
    </div>

    <div class="results" id="results"></div>

    <div class="actions" id="actions" style="display:none;">
      <button id="printBtn" class="btn btn-print">Print</button>
      <button id="retakeBtn" class="btn btn-secondary">Retake</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
